<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밥먹을래말래 · 연결 없음</title>
<style>
:root{--bg:#F7F7F5;--card:#FFFFFF;--text:#191919;--muted:#62625E;--blue:#191919}
@media (prefers-color-scheme:dark){:root{--bg:#111111;--card:#1A1A1A;--text:#F2F2F0;--muted:#B3B3AE;--blue:#F2F2F0}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:24px;box-sizing:border-box}
.c{background:var(--card);border-radius:20px;padding:32px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
img{width:64px;height:64px;border-radius:16px}
h1{font-size:20px;margin:16px 0 6px}
p{margin:0 0 20px;color:var(--muted);line-height:1.5;word-break:keep-all}
button{height:44px;padding:0 20px;border:0;border-radius:12px;background:var(--blue);color:var(--bg);font:inherit;font-weight:700;width:100%}
</style></head>
<body><div class="c"><img src="/static/icon.svg" alt=""><h1>인터넷 연결이 없어요</h1>
<p>와이파이나 데이터를 확인한 뒤 다시 시도해 주세요.</p><button onclick="location.reload()">다시 시도</button></div></body></html>
